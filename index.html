<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Um site simples parecido com a netflix">

    <title>Netflix</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Cabeçalho do site  -->
    <header>
        <h1 class="logo">Netflix</h1>

        <div class="actions">
            <input type="text" id="search" placeholder="Buscar...">
            <!-- Depois colocar método -->
            <button>Tema Escuro</button>
        </div>
    </header>

    <!-- Conteúdo principal da página -->
    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Destaques da Semana</h2>
                <p>Os melhores filmes selecionados para você</p>

                <button class="btn primary">Assistir</button>
                <button class="btn secondary">Mais infos</button>
            </div>
        </section>
        <section class="catalogo">
            <div>
                <h2>Populares</h2>

                <div class="carousel" id="movies">
                </div>
            </div>
            <div>
                <h2>Top 10 filmes</h2>

                <div class="carousel" id="movies2">
                </div>
            </div>
        </section>
    </main>

    <!-- Rodapé do site -->
    <footer>
        <p>&copy; 2026 - Desenvolvido por Osvaldo Deschamps Neto</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
